<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0F14;
    --panel: #101820;
    --panel-2: #131C25;
    --line: #1E2A35;
    --line-strong: #2A3A48;
    --text: #DCE6EC;
    --text-dim: #7C8B96;
    --text-faint: #4C5A65;
    --up: #2FD98A;
    --up-dim: #12332A;
    --active: #FFB020;
    --active-dim: #3A2C0E;
    --down: #445261;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  #srwe-tracker{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    border-radius: 14px;
    padding: 24px 22px 20px;
    max-width: 640px;
    margin: 0 auto;
  }
  .term-head{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--up);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 4px;
  }
  .term-head .dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 6px var(--up);}
  h1{
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 2px 0 2px;
    color: var(--text);
  }
  .sub{
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 18px;
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .stat{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .stat .k{font-family:var(--mono); font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px;}
  .stat .v{font-family:var(--mono); font-size:20px; font-weight:700; margin-top:3px;}
  .stat .v.up{color:var(--up);}
  .stat .v.active{color:var(--active);}
  .bar-outer{
    height:6px;
    background: var(--line);
    border-radius: 3px;
    overflow:hidden;
    margin-top:8px;
  }
  .bar-inner{
    height:100%;
    background: var(--up);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .topo{
    position:relative;
    padding-left: 30px;
  }
  .node{
    position: relative;
    padding: 12px 0 12px 20px;
    border-left: 2px solid var(--line);
  }
  .node:last-child{border-left: 2px solid transparent;}
  .node .stub{
    position:absolute;
    left:-2px;
    top:20px;
    width:16px;
    height:2px;
    background: var(--line);
  }
  .node.status-up{border-left-color: var(--up);}
  .node.status-up .stub{background: var(--up);}
  .node.status-active{border-left-color: var(--active);}
  .node.status-active .stub{background: var(--active);}
  .node .led{
    position:absolute;
    left:-8px;
    top:14px;
    width:14px;
    height:14px;
    border-radius:50%;
    background: var(--bg);
    border: 2px solid var(--down);
    display:flex;align-items:center;justify-content:center;
  }
  .node.status-up .led{border-color: var(--up); background: var(--up-dim);}
  .node.status-active .led{border-color: var(--active); background: var(--active-dim);}
  .node .led i{font-size:8px; color: var(--up);}
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    transition: border-color 0.15s;
  }
  .node.status-active .card{border-color: var(--active-dim); background: var(--panel-2);}
  .card:hover{border-color: var(--line-strong);}
  .check{
    width:20px;height:20px;
    border-radius:5px;
    border: 1.5px solid var(--line-strong);
    background: transparent;
    flex-shrink:0;
    margin-top:2px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:12px;
    color:transparent;
    transition: all 0.12s;
  }
  .check.done{background:var(--up); border-color:var(--up); color:#06150F;}
  .card-body{flex:1; min-width:0;}
  .card-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .date{font-family:var(--mono); font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.4px;}
  .tag{font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:4px; letter-spacing:0.3px;}
  .tag.up{background:var(--up-dim); color:var(--up);}
  .tag.active{background:var(--active-dim); color:var(--active);}
  .tag.down{background:transparent; color:var(--text-faint); border:1px solid var(--line);}
  .title{font-size:14px; font-weight:600; margin:3px 0 2px; color:var(--text);}
  .desc{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .reset-row{
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
  }
  .reset-btn{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    background:transparent;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .reset-btn:hover{color:var(--text-dim); border-color:var(--line-strong);}
  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>

<div id="srwe-tracker">
  <h2 class="sr-only">Suivi interactif du planning de révision CCNA 2, avec cases à cocher persistantes pour chaque session d'étude jusqu'au 31 août.</h2>
  <div class="term-head"><span class="dot"></span>ccna2@srwe:~$ show plan status</div>
  <h1>Plan de révision SRWE — vers le 200-301</h1>
  <p class="sub">12 sessions · 14 → 31 août 2026</p>

  <div class="stat-row">
    <div class="stat">
      <div class="k">Progression</div>
      <div class="v up" id="stat-progress">0%</div>
      <div class="bar-outer"><div class="bar-inner" id="bar" style="width:0%"></div></div>
    </div>
    <div class="stat">
      <div class="k">Sessions faites</div>
      <div class="v" id="stat-done">0/12</div>
    </div>
    <div class="stat">
      <div class="k">Prochaine session</div>
      <div class="v active" id="stat-next" style="font-size:13px;">—</div>
    </div>
  </div>

  <div class="topo" id="topo"></div>

  <div class="reset-row">
    <button class="reset-btn" id="reset-btn">reset plan</button>
  </div>
</div>

<script>
(function(){
  const sessions = [
    {date:"2026-08-14", label:"Ven 14 août", title:"Modules 1 & 2", desc:"Configuration de base + concepts de commutation. Révision express, tu as déjà les bases."},
    {date:"2026-08-17", label:"Lun 17 août", title:"Modules 3 & 4", desc:"VLAN et routage inter-VLAN. Labs Packet Tracer : trunking, router-on-a-stick."},
    {date:"2026-08-18", label:"Mar 18 août", title:"Modules 5 & 6", desc:"STP et EtherChannel. Zone à forte densité de questions à l'examen."},
    {date:"2026-08-19", label:"Mer 19 août", title:"Modules 7 & 8", desc:"DHCPv4, SLAAC et DHCPv6. Bien comparer les deux mécanismes."},
    {date:"2026-08-20", label:"Jeu 20 août", title:"Modules 9 & 10", desc:"FHRP (HSRP/VRRP) et conception de sécurité LAN."},
    {date:"2026-08-21", label:"Ven 21 août", title:"Modules 11 & 12", desc:"Sécurité du commutateur (port security, DAI, DHCP snooping) et concepts WLAN."},
    {date:"2026-08-24", label:"Lun 24 août", title:"Modules 13 & 14", desc:"Configuration WLAN et concepts de routage."},
    {date:"2026-08-25", label:"Mar 25 août", title:"Modules 15 & 16", desc:"Routage statique IP et dépannage de routes statiques/par défaut."},
    {date:"2026-08-26", label:"Mer 26 août", title:"Révision M1 à M8", desc:"Refaire les labs et les QCM de fin de module sur la première moitié."},
    {date:"2026-08-27", label:"Jeu 27 août", title:"Révision M9 à M16", desc:"Idem sur la seconde moitié, focus STP / EtherChannel / sécurité switch."},
    {date:"2026-08-28", label:"Ven 28 août", title:"Examen blanc", desc:"Test blanc type 200-301, puis correction ciblée des erreurs l'après-midi."},
    {date:"2026-08-31", label:"Lun 31 août", title:"Révision finale", desc:"Relecture des fiches, dernier test court, repos avant l'examen."}
  ];

  const topo = document.getElementById('topo');
  const today = new Date(); today.setHours(0,0,0,0);

  function parseDate(s){ const [y,m,d] = s.split('-').map(Number); const dt = new Date(y, m-1, d); dt.setHours(0,0,0,0); return dt; }

  const state = {};

  function render(){
    topo.innerHTML = '';
    let doneCount = 0;
    let nextSession = null;

    sessions.forEach((s, i) => {
      const dt = parseDate(s.date);
      const isDone = !!state[s.date];
      if(isDone) doneCount++;
      const isToday = dt.getTime() === today.getTime();
      const isPastNotDone = dt.getTime() < today.getTime() && !isDone;
      if(!nextSession && !isDone && dt.getTime() >= today.getTime()) nextSession = s;

      let statusClass = 'status-down';
      let tagClass = 'down';
      let tagText = 'planifié';
      if(isDone){ statusClass = 'status-up'; tagClass = 'up'; tagText = 'terminé'; }
      else if(isToday){ statusClass = 'status-active'; tagClass = 'active'; tagText = "aujourd'hui"; }
      else if(isPastNotDone){ tagClass = 'active'; tagText = 'en retard'; }

      const node = document.createElement('div');
      node.className = 'node ' + statusClass;
      node.innerHTML = `
        <div class="stub"></div>
        <div class="led"><i class="ti" style="${isDone ? '' : 'display:none;'}">${isDone ? '✓' : ''}</i></div>
        <div class="card">
          <button class="check ${isDone ? 'done' : ''}" data-date="${s.date}" aria-label="Marquer ${s.title} comme ${isDone ? 'non fait' : 'fait'}">${isDone ? '✓' : ''}</button>
          <div class="card-body">
            <div class="card-top">
              <span class="date">${s.label}</span>
              <span class="tag ${tagClass}">${tagText}</span>
            </div>
            <div class="title">${s.title}</div>
            <div class="desc">${s.desc}</div>
          </div>
        </div>
      `;
      topo.appendChild(node);
    });

    document.getElementById('stat-progress').textContent = Math.round((doneCount/sessions.length)*100) + '%';
    document.getElementById('bar').style.width = Math.round((doneCount/sessions.length)*100) + '%';
    document.getElementById('stat-done').textContent = doneCount + '/' + sessions.length;
    document.getElementById('stat-next').textContent = nextSession ? nextSession.label + ' — ' + nextSession.title : 'Plan terminé';

    document.querySelectorAll('.check').forEach(btn => {
      btn.addEventListener('click', async () => {
        const d = btn.getAttribute('data-date');
        state[d] = !state[d];
        render();
        try{
          await window.storage.set('srwe-session:' + d, state[d] ? 'done' : 'pending', false);
        }catch(e){ console.error('Storage error', e); }
      });
    });
  }

  async function load(){
    try{
      const keys = await window.storage.list('srwe-session:', false);
      if(keys && keys.keys){
        for(const k of keys.keys){
          try{
            const r = await window.storage.get(k, false);
            if(r && r.value === 'done'){
              const d = k.replace('srwe-session:', '');
              state[d] = true;
            }
          }catch(e){}
        }
      }
    }catch(e){ console.error('Load error', e); }
    render();
  }

  document.getElementById('reset-btn').addEventListener('click', async () => {
    for(const s of sessions){
      state[s.date] = false;
      try{ await window.storage.set('srwe-session:' + s.date, 'pending', false); }catch(e){}
    }
    render();
  });

  load();
})();
</script>
